<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1a1f35"/>
      <stop offset="100%" stop-color="#0a0c1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b2b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff6b2b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g clip-path="url(#circle)" opacity="0.06" stroke="#6366f1" stroke-width="0.5">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Orange glow top-right -->
  <circle cx="300" cy="100" r="160" fill="url(#glow)" clip-path="url(#circle)"/>
  <!-- Indigo glow bottom-left -->
  <circle cx="100" cy="300" r="160" fill="url(#indigo-glow)" clip-path="url(#circle)"/>

  <!-- Decorative arc -->
  <circle cx="200" cy="200" r="155" fill="none" stroke="#6366f1" stroke-width="0.6" stroke-dasharray="4 8" opacity="0.25"/>

  <!-- Orange accent corner dots -->
  <circle cx="340" cy="70" r="3" fill="#ff6b2b" opacity="0.6"/>
  <circle cx="355" cy="85" r="1.5" fill="#ff6b2b" opacity="0.4"/>
  <circle cx="60" cy="330" r="3" fill="#6366f1" opacity="0.6"/>
  <circle cx="45" cy="315" r="1.5" fill="#6366f1" opacity="0.4"/>

  <!-- T lettermark -->
  <!-- Horizontal bar -->
  <rect x="112" y="138" width="176" height="28" rx="5" fill="#ff6b2b"/>
  <!-- Vertical stem -->
  <rect x="174" y="138" width="52" height="140" rx="5" fill="#1a2040"/>
  <!-- Vertical stem top overlap with bar color -->
  <rect x="174" y="138" width="52" height="28" rx="5" fill="#ff6b2b"/>
  <!-- Vertical stem body -->
  <rect x="174" y="158" width="52" height="120" rx="0" fill="#e8f0ff" opacity="0.92"/>
  <!-- Indigo accent bottom of stem -->
  <rect x="174" y="250" width="52" height="28" rx="0" fill="#6366f1" opacity="0.7"/>

  <!-- Bottom label -->
  <text x="200" y="322" text-anchor="middle" font-family="'Georgia', serif" font-size="13" letter-spacing="6" fill="#6366f1" opacity="0.7">TOOLSMATIC</text>
</svg>
