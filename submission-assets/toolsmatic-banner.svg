<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="160" y1="60" x2="1080" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1323"/>
      <stop offset="1" stop-color="#101C2E"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 180) rotate(90) scale(220 300)">
      <stop stop-color="#5DE3D6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5DE3D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 470) rotate(90) scale(180 260)">
      <stop stop-color="#60A5FA" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandBar" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF9B4A"/>
      <stop offset="1" stop-color="#FF6432"/>
    </linearGradient>
    <linearGradient id="brandStem" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E6ECFA"/>
      <stop offset="1" stop-color="#C6D2E7"/>
    </linearGradient>
    <linearGradient id="brandAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8F8BFF"/>
      <stop offset="1" stop-color="#6F7BFF"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#040A14" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glowA)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glowB)"/>

  <g opacity="0.18">
    <circle cx="140" cy="120" r="3" fill="#60A5FA"/>
    <circle cx="1040" cy="120" r="5" fill="#FF7B4A"/>
    <circle cx="1080" cy="470" r="4" fill="#5DE3D6"/>
    <circle cx="180" cy="520" r="6" fill="#6F7BFF"/>
  </g>

  <g filter="url(#shadow)" transform="translate(140 126)">
    <rect x="0" y="0" width="284" height="284" rx="68" fill="rgba(10, 18, 32, 0.58)"/>
    <rect x="58" y="52" width="168" height="34" rx="10" fill="url(#brandBar)"/>
    <rect x="118" y="86" width="48" height="138" rx="4" fill="url(#brandStem)"/>
    <rect x="118" y="184" width="48" height="40" rx="0" fill="url(#brandAccent)"/>
    <circle cx="142" cy="142" r="116" stroke="#2B3E58" stroke-opacity="0.55" stroke-dasharray="6 12"/>
  </g>

  <g transform="translate(490 160)">
    <text x="0" y="0" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="1">TOOLSMATIC</text>
    <text x="0" y="94" fill="#8FE8FF" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0.8">Instant browser tools that feel premium and stay fast</text>
    <text x="0" y="150" fill="#C7D4E7" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="500">Privacy-first utilities for SEO, writing, design, developer work, conversions, and everyday tasks.</text>

    <g transform="translate(0 220)">
      <rect width="196" height="54" rx="16" fill="#0C1728" stroke="#24435B"/>
      <text x="26" y="35" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">30+ tools</text>

      <rect x="220" width="230" height="54" rx="16" fill="#0C1728" stroke="#24435B"/>
      <text x="246" y="35" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">No sign-up to use</text>

      <rect x="474" width="214" height="54" rx="16" fill="#0C1728" stroke="#24435B"/>
      <text x="500" y="35" fill="#EAF2FF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Mobile ready</text>
    </g>
  </g>
</svg>
